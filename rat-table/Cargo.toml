[package]
name = "rat-table"
version = "0.1.0"
edition = "2024"
description = "ratatui table widget for large data"
license = "MIT/Apache-2.0"
repository = "https://github.com/thscharler/rat-salsa"
readme = "readme.md"
keywords = ["ratatui", "table", "large"]
categories = ["command-line-interface"]
exclude = [".idea/*", ".gitignore", "ftable.gif"]

[dependencies]
log = "0.4"

ratatui-core = { version = "0.1", features = ["std", "layout-cache"] }
ratatui-widgets = { version = "0.3", features = ["std", "unstable-rendered-line-info"] }
ratatui-crossterm = { version = "0.1" }

rat-event = { version = "2.1" }
rat-reloc = { version = "2.0" }
rat-cursor = { version = "2.0" }
rat-focus = { version = "2.1" }
rat-scrolled = { version = "2.0" }

[lints]
workspace = true

[dev-dependencies]
fern = "0.7"
rand = "0.10"
anyhow = "1.0"
format_num_pattern = "0.9"
unicode-segmentation = "1.11"

rat-theme4 = { version = "4.5" }